    <defs>
        <linearGradient id="categoriesGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#198754"/>
            <stop offset="100%" stop-color="#0f5132"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="560" fill="url(#categoriesGradient)"/>
